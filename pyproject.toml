[project]
name = "entari-plugin-llm"
version = "0.5.0rc4"
description = "An Entari Plugin for LLM Chat with Function Call"
authors = [
    {"name" = "RF-Tar-Railt", "email" = "rf_tar_railt@qq.com"},
    {"name" = "KomoriDev", "email" = "mute231010@gmail.com"}
]
dependencies = [
    "arclet-entari>=0.19.2",
    "agno[sqlite,openai]>=3.1.8",
    "docstring-parser>=0.17.0",
    "entari-plugin-user>=0.2.0",
]
requires-python = ">=3.11,<3.16"
readme = "README.md"
license = {"text" = "MIT"}

[project.optional-dependencies]
browser = [
    "entari-plugin-browser>=0.5.4",
]
# Native provider adapters. The OpenAI-compatible family only needs the core
# `openai` dependency; the SDKs below are opt-in to keep installs slim.
google = [
    "agno[google]>=3.1.0",
]
anthropic = [
    "agno[anthropic]>=3.1.0",
]
aws-bedrock = [
    "agno[aws-bedrock]>=3.1.0",
]
mistral = [
    "agno[mistral]>=3.1.0",
]
cohere = [
    "agno[cohere]>=3.1.0",
]
groq = [
    "agno[groq]>=3.1.0",
]
ollama = [
    "agno[ollama]>=3.1.0",
]
cerebras = [
    "agno[cerebras]>=3.1.0",
]
# Optional local cost estimation for providers that do not report usage.cost.
# Provider-reported costs are always used first, so this extra is not required.
pricing = [
    "genai-prices>=0.1.13",
]
# Optional long-tail fallback. Most providers use native adapters and do not
# need this extra.
litellm = [
    "litellm>=1.103.2",
    "mcp>=2.2.0,<3",
]

[dependency-groups]
dev = [
    "arclet.entari[yaml,cron,reload,dotenv]>=0.19.2",
    "entari-plugin-server>=0.8.2",
    "satori-python-adapter-onebot11>=0.5.0",
    "ruff>=0.14.10",
    "ddgs>=9.11.2",
    "satori-python-adapter-milky>=0.3.1",
    "litellm[mcp]>=1.106.0",
    "genai-prices>=0.1.13",
    "satori-python-adapter-qq>=0.6.2",
    "exa-py>=2.26.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
include = ["src/entari_plugin_llm/**/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "C", "T", "PYI", "PT", "Q", "I"]
ignore = ["C901", "T201", "E731", "E402", "PYI055"]

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "basic"


[tool.pdm]
distribution = true

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
